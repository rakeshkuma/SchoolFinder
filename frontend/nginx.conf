# Public, read-only API answers (the same for every visitor) are kept here. A copy is fresh for 30 seconds, so edits
# show almost at once; after that nginx asks the backend again, and if the backend is down or restarting (a deploy
# takes a few minutes on the small server) it keeps serving the last good copy instead of an error. Copies unused for
# 7 days are dropped.
proxy_cache_path /var/cache/schooldhundo-api levels=1:2 keys_zone=sd_api:20m max_size=300m inactive=7d use_temp_path=off;

# Anything that identifies a visitor (an admin token, a guest practice identity or a signed-in session) bypasses the
# cache in both directions, so personal answers are never stored or shared.
map "$http_authorization$http_x_participant_token$cookie_ISF_SESSION" $sd_personal {
    ""      0;
    default 1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    # Redirects say only the path (Location: /privacy). nginx sits behind a TLS proxy, so its own scheme and port
    # (http, 8081 on the Oracle server) are not the address visitors use.
    absolute_redirect off;

    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Same-origin API: the browser never needs CORS in this setup.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Keep the scheme set by the TLS proxy in front of this container, if there is one.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        client_max_body_size 6m;
    }

    # Public reads that every page needs: schools, places, rankings, admissions, exams, practice sets and the blog.
    # Writes under these paths (reviews, suggested updates, scores) are POSTs and always go straight to the backend.
    location ~ ^/api/v1/(schools|locations|rankings|admissions|exams|stats|reference|practice-bank|practice-sets|blog|updates)(/|$) {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        client_max_body_size 6m;

        proxy_cache sd_api;
        proxy_cache_methods GET HEAD;
        proxy_cache_key "$request_method|$request_uri";
        proxy_cache_bypass $sd_personal;
        proxy_no_cache $sd_personal;
        # The backend marks every answer no-store (Spring Security's default); these paths are public, so that is
        # overridden here. Answers that set a cookie are still never stored.
        proxy_ignore_headers Cache-Control Expires;
        proxy_cache_valid 200 30s;
        proxy_cache_valid 404 10s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        # Browsers must still ask every time; only nginx keeps the copy.
        proxy_hide_header Cache-Control;
        proxy_hide_header Pragma;
        proxy_hide_header Expires;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        add_header X-Cache $upstream_cache_status always;
    }

    # Official notices uploaded for review may be scans of up to 15 MB; every other request keeps the 6 MB limit.
    location = /api/v1/admin/documents {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        client_max_body_size 16m;
    }

    # Generated from the database by the backend (absolute URLs use PUBLIC_SITE_URL).
    location ~ ^/(robots\.txt|sitemap\.xml|sitemaps/[a-z0-9-]+\.xml)$ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Hashed file names: safe to cache for a year.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The app shell must always be revalidated so a new deployment is picked up at once. Server-side includes put the
    # page's own title, description, canonical URL and structured data into its <head> (see index.html), so search
    # engines and link previews that do not run JavaScript still see page-specific metadata.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        ssi on;
        # A failed include (backend down, nothing cached yet) leaves the page as it would be without it.
        ssi_silent_errors on;
    }

    # Target of the include above: the original request path, answered by the backend. Internal only.
    location ^~ /__seo/ {
        internal;
        proxy_pass http://backend:8080/api/v1/seo/head/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        # The page's own tags survive a backend restart: the last good copy is used meanwhile.
        proxy_cache sd_api;
        proxy_cache_key "seo-head|$request_uri";
        proxy_cache_valid 200 10m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
    }

    # Target of the second include: the page's main content as plain HTML (headings, facts and links), so search
    # engines and visitors see real content before the app starts. The app replaces it on load. Internal only.
    location ^~ /__seo_body/ {
        internal;
        proxy_pass http://backend:8080/api/v1/seo/body/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        proxy_cache sd_api;
        proxy_cache_key "seo-body|$request_uri";
        proxy_cache_valid 200 10m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
    }

    # Common names for the policy pages, answered with a permanent redirect to the real address.
    location = /privacy-policy { return 301 /privacy; }
    location = /terms-of-service { return 301 /terms; }
    location = /terms-and-conditions { return 301 /terms; }
    # The boarding directory lives at /boarding; /boarding-schools is a common name for it.
    location = /boarding-schools { return 301 /boarding; }
    location ~ ^/boarding-schools/(india|government|private|boys|girls|co-ed|affordable)/?$ { return 301 /boarding/$1; }

    # Client-side routing.
    location / {
        try_files $uri /index.html;
    }
}
