# Included in every location that sets its own add_header: nginx drops inherited add_header
# directives as soon as a location declares one, so the headers are repeated through this file.
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options DENY always;
add_header Permissions-Policy "camera=(), microphone=(), payment=(), geolocation=(self)" always;
# img-src https: allows OpenStreetMap tiles and licensed photos hosted by schools or Wikimedia Commons.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
