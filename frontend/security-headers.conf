# Included in every location that sets its own add_header: nginx drops inherited add_header
# directives as soon as a location declares one, so the headers are repeated through this file.
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options DENY always;
add_header Permissions-Policy "camera=(), microphone=(), payment=(), geolocation=(self)" always;
# img-src https: allows OpenStreetMap tiles and licensed photos hosted by schools or Wikimedia Commons; blob: shows
# document pages in the admin review, which are fetched with the admin token and displayed from memory.
# Google Analytics (googletagmanager.com script, google-analytics.com collection) loads only after a visitor accepts
# cookies and only in builds with VITE_GA_MEASUREMENT_ID. AdSense needs further entries when it is switched on; see
# GOOGLE_SEO_ADSENSE_DEPLOYMENT_GUIDE.md.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' https://www.googletagmanager.com; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
