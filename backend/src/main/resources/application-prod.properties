# Production. Every value below must come from the environment; there are no fallbacks for secrets.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Never let Hibernate change the schema in production; Flyway may never clean.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.jwt.secret=${JWT_SECRET}
app.seed.enabled=false

# Member session cookies only over HTTPS; account links point at the public site; never the dev outbox.
server.servlet.session.cookie.secure=true
app.account.link-base-url=${ACCOUNT_LINK_BASE_URL:${PUBLIC_SITE_URL}}
app.mail.dev-outbox=false

# Behind a TLS-terminating proxy / load balancer.
server.forward-headers-strategy=framework
server.shutdown=graceful

# Swagger UI and the OpenAPI document are off unless SWAGGER_ENABLED=true (e.g. for partners).
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

logging.level.root=INFO
logging.level.com.indiaschoolfinder=INFO
