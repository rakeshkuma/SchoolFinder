# ---------------------------------------------------------------------------------------------
# India School Finder - shared configuration. Secrets and environment-specific values come from
# environment variables (see ../.env.example). Never put real credentials in this file.
# ---------------------------------------------------------------------------------------------
spring.application.name=india-school-finder
spring.profiles.default=dev
server.port=${SERVER_PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never

# Database (PostgreSQL)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/india_school_finder}
spring.datasource.username=${DB_USERNAME:isf_app}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

# JPA / Hibernate: schema is owned by Flyway; Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.default-property-inclusion=always

# Uploads (CSV import, image upload, and official notices for document review; images keep their own 5 MB limit)
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=16MB

# Actuator: only health and info are public.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.info.env.enabled=false

# OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.default-produces-media-type=application/json

# Application
app.timezone=Asia/Kolkata
# Absolute site address for sitemap.xml / robots.txt (e.g. https://schools.example.in); blank = taken from the request
app.public-site-url=${PUBLIC_SITE_URL:}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.jwt.secret=${JWT_SECRET:}
app.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:PT15M}
app.jwt.issuer=india-school-finder
app.admin.bootstrap-username=${ADMIN_BOOTSTRAP_USERNAME:}
app.admin.bootstrap-password=${ADMIN_BOOTSTRAP_PASSWORD:}
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
app.cloudinary.api-key=${CLOUDINARY_API_KEY:}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
app.cloudinary.folder=${CLOUDINARY_FOLDER:india-school-finder}
app.ranking.methodology-version=2.0
app.ranking.min-coverage-percent=70
app.ranking.min-reviews-for-parent-feedback=5
app.ranking.max-evidence-age-years=3
app.ranking.student-teacher-ratio-best=20
app.ranking.student-teacher-ratio-worst=40
app.rate-limit.enabled=true
app.rate-limit.login-per-minute=5
app.rate-limit.reviews-per-hour=5
app.rate-limit.update-submissions-per-hour=10
app.rate-limit.public-writes-per-minute=60
app.rate-limit.suggestions-per-minute=120
app.data-quality.stale-after-days=365
# Shown first on the admin coverage dashboard (ISO 3166-2:IN codes)
app.data-quality.priority-states=${COVERAGE_PRIORITY_STATES:DL,BR,UP,JH,HR}
# Member accounts: server-side sessions (Spring Session JDBC, tables created by Flyway V18). The browser holds only
# an HttpOnly cookie. Sessions end after SESSION_TIMEOUT without activity unless "keep me signed in" is chosen.
spring.session.jdbc.initialize-schema=never
spring.session.jdbc.cleanup-cron=0 */10 * * * *
server.servlet.session.timeout=${SESSION_TIMEOUT:2h}
server.servlet.session.cookie.name=ISF_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
app.account.link-base-url=${ACCOUNT_LINK_BASE_URL:}
app.rate-limit.account-emails-per-hour=10
# Account email: SMTP is enabled by setting SPRING_MAIL_HOST (+ SPRING_MAIL_PORT, SPRING_MAIL_USERNAME,
# SPRING_MAIL_PASSWORD, SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE=true) and MAIL_FROM. Without SMTP nothing
# is sent and the sign-up pages say so. spring.mail.host is deliberately not set here.
app.mail.from=${MAIL_FROM:}
app.mail.dev-outbox=${MAIL_DEV_OUTBOX:false}
# "Continue with Google" appears only when both are set (Google Cloud OAuth client, type "Web application").
app.account.google.client-id=${GOOGLE_CLIENT_ID:}
app.account.google.client-secret=${GOOGLE_CLIENT_SECRET:}

# Exam catalogue: loaded once into an empty database; exam records unchecked for longer than this are flagged
app.exams.seed-on-empty=true
app.exams.seed-location=classpath:seed/exams.json
app.exams.stale-after-days=60
app.scheduling.enabled=true
app.seed.enabled=false
