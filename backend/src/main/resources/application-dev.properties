# Local development. Values still come from the environment where they are secrets.
logging.level.com.indiaschoolfinder=DEBUG
logging.level.org.hibernate.SQL=INFO

# Loads src/main/resources/seed/delhi-schools.csv (source-linked, unverified) when the DB is empty.
app.seed.enabled=${SEED_ENABLED:true}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

management.endpoint.health.show-details=always

# Account email stays in an in-memory outbox (shown at /api/v1/dev/outbox) unless SMTP is configured.
app.mail.dev-outbox=${MAIL_DEV_OUTBOX:true}
app.account.link-base-url=${ACCOUNT_LINK_BASE_URL:http://localhost:5173}
