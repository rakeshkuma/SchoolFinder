# Production overrides for a single server. Use together with docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Put a TLS-terminating reverse proxy (Caddy, nginx, a cloud load balancer) in front of port 80; see DEPLOYMENT.md.
services:
  db:
    restart: unless-stopped
    # No published port: only the backend container can reach the database.
    ports: !reset []

  backend:
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SEED_ENABLED: "false"
      # The browser talks to nginx on the same origin, so CORS only needs the public site address.
      CORS_ALLOWED_ORIGINS: ${PUBLIC_SITE_URL:?Set PUBLIC_SITE_URL in .env, e.g. https://schools.example.in}
      # Absolute URLs in sitemap.xml and robots.txt.
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
    # Reached only through nginx (/api); not published on the host.
    ports: !reset []
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep -q UP || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  frontend:
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports: !override
      - "${FRONTEND_PORT:-80}:80"
